name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type & Lint Checks
        run: npm run lint

      - name: Run Algorithmic & ML Pipeline Tests
        run: npx tsx tests/pipeline.test.ts

      - name: Build Production Bundle
        run: npm run build
